name: Scanner 30m

on:
  workflow_dispatch:

concurrency:
  group: crypto-scanner-30m
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner (30m)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py 30m

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state-30m.json
          git diff --quiet --cached || git commit -m "Update signal state (30m) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push mislukt, poging $i, probeer opnieuw over 5 seconden..."
            sleep 5
          done
